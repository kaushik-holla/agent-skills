# pyproject.toml template for the python-quality skill.
# Replace `myapp` with your package name. Lower bounds are floors, not pins:
# the committed uv.lock is what makes installs reproducible.

[project]
name = "myapp"
version = "0.1.0"
description = "An example agentic application."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Your Name" }]
license = "MIT"
dependencies = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",          # init_chat_model, create_agent, langchain.mcp
  "langchain-openai>=1.0,<2",   # or langchain-anthropic / langchain-google-genai
  "pydantic>=2.11",
  "pydantic-settings>=2.8",
  "typer>=0.15",
  "rich>=13",
]

[project.optional-dependencies]
tavily = ["tavily-python>=0.5"]
tracing = ["langsmith>=0.3"]
sqlite = ["langgraph-checkpoint-sqlite>=2.0"]
postgres = ["langgraph-checkpoint-postgres>=2.0"]

# PEP 735 dependency groups: dev tooling is not part of the published package.
# `uv sync` installs the `dev` group by default; pip >= 25.1 uses `--group dev`.
[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7",
  "ruff>=0.17",
  "mypy>=2.4",
  "pre-commit>=4",
]

[project.scripts]
myapp = "myapp.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myapp"]

# ---- ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "checkpoints"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "B",     # bugbear
  "UP",    # pyupgrade
  "RUF",   # ruff-native
  "SIM",   # flake8-simplify
  "PIE",   # flake8-pie
  "PL",    # pylint subset
  "S",     # flake8-bandit (security)
  "PT",    # flake8-pytest-style
  "ASYNC", # blocking calls inside async code
]
ignore = [
  "E501",      # line length handled by formatter
  "PLR0913",   # too-many-arguments (false-positive heavy)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PLR2004"]  # asserts, random, magic numbers

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---- mypy ----
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false   # pytest decorators are not typed well

# ---- pytest ----
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "-m", "not live_llm and not eval and not slow",
]
markers = [
  "slow: tests that take more than a few seconds",
  "live_llm: tests that hit a real LLM provider",
  "eval: LLM-as-judge or rubric-based evals",
]
filterwarnings = [
  "error::DeprecationWarning:myapp.*",   # our own deprecations fail the build
]

[tool.coverage.run]
source = ["src/myapp"]
branch = true

[tool.coverage.report]
# fail_under = 80   # turn on once the suite is established (production gate)
show_missing = true
exclude_also = [
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
